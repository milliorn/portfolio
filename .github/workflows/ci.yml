# Verifies the site still lints, type-checks, and builds on every PR,
# including Dependabot's. automerge.yml only inspects Dependabot's update
# metadata (patch/minor/major) -- it never installs or builds anything, so a
# patch release that breaks the Astro build would otherwise merge unchecked.
# Add this workflow's job as a required status check (alongside
# merge-gatekeeper) so that no longer happens.
name: CI

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Real run times vary 40-104s across recent runs (npm/build variance),
    # not the ~10-20s this repo's other workflows see. 2min left as little
    # as 16s of margin on the slow end, genuinely flaky. 3min covers the
    # observed range with real headroom.
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Runs astro check, eslint, prettier --check, and tsc --noEmit together.
      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run astro:build
