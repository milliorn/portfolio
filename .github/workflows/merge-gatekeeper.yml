---
name: Merge Gatekeeper

on:
  pull_request:
    branches:
      - main

jobs:
  merge-gatekeeper:
    runs-on: ubuntu-latest
    # This job waits on build (ci.yml), which itself varies 40-104s, so
    # merge-gatekeeper's own real duration tracks that variance plus
    # polling overhead: 45-110s observed across recent runs, leaving as
    # little as 10s margin at 2min. 5min covers that with real headroom
    # without masking a genuinely stuck check.
    timeout-minutes: 5
    permissions:
      checks: read
      statuses: read
    steps:
      - name: Run Merge Gatekeeper
        uses: upsidr/merge-gatekeeper@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Informational Netlify config check, not the actual deploy
          # (that's the separate netlify/.../deploy-preview status). Its
          # webhook left this one stuck in_progress with no completion
          # event even after the real deploy finished, which would
          # otherwise hang this job until timeout.
          ignored: "Pages changed - milliorn-portfolio"
