name: Dependabot reviewer

# Fires whenever Dependabot opens, updates, or reopens a PR targeting main.
# pull_request_target runs in the context of the base branch, which gives the
# GITHUB_TOKEN enough permission to approve and merge without extra secrets.
#
# This workflow owns both outcomes for every Dependabot PR:
# - green -> merge: review-dependabot-pr queues `gh pr merge --auto`, and
#   GitHub merges once the required checks pass.
# - red -> close: close-red-dependabot-prs (below). It can't live in
#   review-dependabot-pr, which runs when the PR opens, before any check has a
#   result, so it runs on the extra triggers instead.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: ["main"]
  # Right after any Merge Gatekeeper run finishes (the red/green verdict).
  workflow_run:
    workflows: ["Merge Gatekeeper"]
    types: [completed]
  # Sweeps PRs that went red before this job existed (like #383) as soon as
  # it lands, and after every merge.
  push:
    branches: [main]
  # Backstop in case an event is missed.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# One run per PR at a time. We let the current run finish so an in-progress
# squash merge isn't interrupted mid-flight. Non-PR triggers have no PR
# number, so they share one "sweep" group and queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

# Minimum permissions needed:
# - pull-requests: approve, comment on, and close PRs
# - contents: enable auto-merge (writes to the merge queue)
# - checks: read merge-gatekeeper's verdict
permissions:
  pull-requests: write
  contents: write
  checks: read

jobs:
  review-dependabot-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Only on the PR event, and only for PRs opened by Dependabot.
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      # PAT, not GITHUB_TOKEN: a GITHUB_TOKEN-authored merge can't trigger
      # other workflow runs (GitHub's anti-recursion protection), so it would
      # silently never fire dependabot-rebase-cascade.yml's trigger, and
      # stale sibling PRs would never get rebased. A PAT-authenticated merge
      # is a normal event and triggers it correctly. Needs Contents:
      # read/write in addition to Pull requests: read/write, or --auto fails
      # with "Resource not accessible by personal access token
      # (enablePullRequestAutoMerge)".
      GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_PAT }}

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      # Decide once: allow github-actions (any semver) or patch/minor updates;
      # deny everything else. Major updates are filtered upstream by dependabot.yml,
      # so deny is a safety net for anything unexpected that slips through.
      - name: Decide
        id: decision
        run: |
          ecosystem="${{ steps.metadata.outputs.package-ecosystem }}"
          update_type="${{ steps.metadata.outputs.update-type }}"
          if [[ "$ecosystem" == "github_actions" ]] || \
             [[ "$update_type" == "version-update:semver-patch" ]] || \
             [[ "$update_type" == "version-update:semver-minor" ]]; then
            echo "action=allow" >> "$GITHUB_OUTPUT"
          else
            echo "action=deny" >> "$GITHUB_OUTPUT"
          fi

      # --auto queues the merge so all required branch protection checks must
      # pass first (e.g. dependency-review) before the merge goes through.
      - name: Allow — approve and merge
        if: steps.decision.outputs.action == 'allow'
        run: |
          gh pr review "$PR_URL" --approve -b "Auto-approved: **${{ steps.metadata.outputs.update-type }}** ${{ steps.metadata.outputs.package-ecosystem }} update."
          gh pr merge "$PR_URL" --squash --auto

      - name: Deny — unexpected update
        if: steps.decision.outputs.action == 'deny'
        run: |
          gh pr close "$PR_URL" --comment "Auto-closed: ecosystem \`${{ steps.metadata.outputs.package-ecosystem }}\` / update-type \`${{ steps.metadata.outputs.update-type }}\` did not match any allow-list rule. Check dependabot.yml if this is unexpected."

  # Red -> close. merge-gatekeeper is the single verdict: it waits on every
  # other check on the commit (build, dependency-review, Netlify
  # deploy-preview, this workflow, labeler) and fails if any of them fails.
  # So "its latest run on the PR's CURRENT head commit completed and did not
  # succeed" == red (e.g. #383: astro@5.18.2 fails dependency-review on
  # advisories fixed only in astro 6/7, so auto-merge can never fire).
  close-red-dependabot-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ github.event_name != 'pull_request_target' }}
    env:
      # GITHUB_TOKEN is enough to close and comment. Closing (not merging)
      # doesn't need to trigger other workflows; dependabot-rebase-cascade.yml
      # only reacts to merges.
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Close Dependabot PRs whose merge-gatekeeper is red
        run: |
          set -euo pipefail
          # headRefOid = the PR's current head commit. Checking the verdict on
          # that exact commit means a stale red run from before a rebase can
          # never close a PR whose new commit is still running or green.
          gh pr list --repo "$REPO" --author "app/dependabot" --state open \
            --json number,headRefOid \
            --jq '.[] | "\(.number) \(.headRefOid)"' |
          while read -r pr sha; do
            # Latest merge-gatekeeper run on that commit. Re-runs create new
            # check runs with higher ids; sort by id, not started_at, because
            # a queued re-run has started_at=null and would sort first.
            verdict=$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=merge-gatekeeper&per_page=100" \
              --jq '.check_runs | sort_by(.id) | last | if . == null then "none" else "\(.status) \(.conclusion)" end')
            echo "PR #$pr @ ${sha:0:7}: merge-gatekeeper = $verdict"
            case "$verdict" in
              none|"queued "*|"in_progress "*|"completed success")
                continue ;;  # not run yet, still running, or green
            esac
            url="https://github.com/$REPO/commit/$sha/checks"
            gh pr close "$pr" --repo "$REPO" --comment "Auto-closed: merge-gatekeeper finished \`${verdict#completed }\` on ${sha:0:7}, so this update can't merge. See the failing check(s): $url"
            echo "Closed PR #$pr"
          done
